config:
  cwd: './external'
  build_dir: './build'

# Modbus-RTU-over-USB session.  The NSH console (core0) is the USART2 line on
# the on-board ST-LINK VCP; the Modbus-RTU proto is the F4 USB CDC/ACM, set by
# modbus.serial_port.  Adjust the /dev/ttyACMx numbers to the host.

product:
  name: "dawn-stm32f4discovery-modbus-ntfc"
  modbus:
    serial_port: '/dev/ttyACM1'
    parity: 'E'
  cores:
    core0:
      name: 'main'
      device: 'serial'
      exec_path: '/dev/ttyACM0'
      exec_args: '115200,n,8,1'
      defconfig: '../../boards/arm/stm32f4/stm32f4discovery/configs/modbus_ntfc'
      flash: 'st-flash --connect-under-reset --reset write $IMAGE_BIN 0x08000000'
      reboot: 'st-flash --connect-under-reset reset'
      dcmake:
        CMAKE_SUPPRESS_DEVELOPER_WARNINGS: "ON"
