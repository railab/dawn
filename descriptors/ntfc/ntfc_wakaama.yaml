metadata:
  title: Wakaama LwM2M NTFC Demo
  version: '1.0'
  description: >
    Exposes a small LwM2M object set over Wakaama for qemu-intel64 NTFC
    registration, read, and write verification.
  os_required:
  - udp
  - /tmp

includes:
- id: wk
  path: ../examples/include_blocks/wakaama_objects_common.yaml

protocols:
- id: wakaama_main
  type: wakaama
  config:
    endpoint: ntfc-wakaama
    local_port: 56830
    servers:
      - port: 5683
        lifetime: 60
        short_server_id: 123
      - port: 5684
        lifetime: 60
        short_server_id: 124
        security_instance: 1
        server_instance: 1
    device:
      manufacturer: Dawn
      serial_number: dawn-wakaama
      firmware_version: '0.1'
    objects:
      - object: digital_input
        instance: 0
        resources:
        - resource: digital_input_state
          io: "@wk.wakaama_digital_input"
          access: read
      - object: digital_output
        instance: 0
        resources:
        - resource: digital_output_state
          io: "@wk.wakaama_digital_output"
          access: rw
      - object: analog_input
        instance: 0
        resources:
        - resource: analog_input_current_value
          io: "@wk.wakaama_analog_input"
          access: read
      - object: analog_output
        instance: 0
        resources:
        - resource: analog_output_current_value
          io: "@wk.wakaama_analog_output"
          access: rw
      - object: generic_sensor
        instance: 0
        resources:
        - resource: sensor_value
          io: "@wk.wakaama_generic_sensor"
          access: read
      - object: temperature
        instance: 0
        resources:
        - resource: sensor_value
          io: "@wk.wakaama_temperature"
          access: read
      - object: humidity
        instance: 0
        resources:
        - resource: sensor_value
          io: "@wk.wakaama_humidity"
          access: read
      - object: actuation
        instance: 0
        resources:
        - resource: on_off
          io: "@wk.wakaama_switch"
          access: rw
      - object: light_control
        instance: 0
        resources:
        - resource: on_off
          io: "@wk.wakaama_switch"
          access: rw
        - resource: dimmer
          io: "@wk.wakaama_dimmer"
          access: rw
      - object: binary_app_data_container
        instance: 0
        resources:
        - resource: binary_app_data
          io: "@wk.wakaama_blob"
          access: rw
      - object: firmware_update
        instance: 0
        resources:
        - resource: firmware_package
          io: "@wk.wakaama_firmware_package"
          access: rw
        - resource: firmware_update
          io: "@wk.wakaama_firmware_update_trigger"
          access: execute
        - resource: firmware_state
          io: "@wk.wakaama_firmware_state"
          access: read
        - resource: firmware_update_result
          io: "@wk.wakaama_firmware_result"
          access: read
      - object_id: 33000
        instance: 0
        resources:
        - resource_id: 1
          io: "@wk.wakaama_counter"
          access: rw
