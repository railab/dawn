metadata:
  title: Shell GPIO and Config Demo
  version: '1.0'
  description: >
    Provides shell access to demo IO, GPIO inputs and outputs, ADC config-backed
    values, system information, and reset control.
  os_required:
  - /dev/adc0
  - /dev/pwm0
  - /dev/gpio0
  - /dev/gpio1
  - /dev/gpio2
  - /dev/gpio3
  - /dev/gpio4
  - /dev/gpio5
  - /dev/gpio6
  - /dev/gpio7
ios:
- &id001
  id: dummyio1
  type: dummy
  dtype: uint32
  config:
    init_value: 1234
- &id006
  id: uptime1
  type: sysinfo
  dtype: float
  variant: uptime
- &id007
  id: cpuload1
  type: sysinfo
  dtype: float
  variant: cpuload
- &id019
  id: reset1
  type: boardctl
  dtype: bool
  variant: reset
- &id020
  id: cfgio1
  type: config
  dtype: uint32
  rw: true
  config:
    objid_ref: dummyio1
- &id024
  id: adc1
  type: adc_fetch
  dtype: uint32
  config:
    device: 0
- &id025
  id: pwm1
  type: pwm
  dtype: uint32
  config:
    device: 0
includes:
- id: gpio
  path: include_blocks/gpio_bank_common.yaml
protocols:
- id: shell1
  type: shell
  bindings:
  - *id001
  - *id006
  - *id007
  - "@gpio.gpi1"
  - "@gpio.gpi2"
  - "@gpio.gpi3"
  - "@gpio.gpi4"
  - "@gpio.gpo1"
  - "@gpio.gpo2"
  - "@gpio.gpo3"
  - "@gpio.gpo4"
  - *id019
  - *id020
  - *id024
  - *id025
  config:
    prompt: abcde>
