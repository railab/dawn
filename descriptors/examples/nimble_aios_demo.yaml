metadata:
  title: NimBLE Automation IO Service (AIOS) Demo
  version: '1.0'
  description: >
    Minimal demo focused on the Bluetooth SIG Automation IO Service
    (UUID 0x1815). Exposes four digital inputs (buttons / GPI), four
    digital outputs (LEDs / GPO), one analog input (dummy float), and
    four analog outputs packed into the four-channel PWM driver.
    Pair with nRF Connect (or any AIOS-aware client) to exercise the
    digital read/write, analog read, and PWM duty-cycle write paths.
  os_required:
  - /dev/gpio0
  - /dev/gpio1
  - /dev/gpio2
  - /dev/gpio3
  - /dev/gpio4
  - /dev/gpio5
  - /dev/gpio6
  - /dev/gpio7
  - /dev/pwm0
  - ble
ios:
- &analog_input_io
  id: dummyio1
  type: dummy
  dtype: float
  config:
    init_value: 1.5
- &pwm_ch0
  id: pwm_ch0
  type: virt
  dtype: uint32
- &pwm_ch1
  id: pwm_ch1
  type: virt
  dtype: uint32
- &pwm_ch2
  id: pwm_ch2
  type: virt
  dtype: uint32
- &pwm_ch3
  id: pwm_ch3
  type: virt
  dtype: uint32
- &pwm0
  id: pwm0
  type: pwm
  dtype: uint32
  config:
    device: 0
    freq: 1000
- &pwm_freq
  id: pwm_freq
  type: config
  dtype: uint32
  rw: true
  config:
    objid_ref: pwm0
    objcfg_ref: freq
includes:
- id: gpio
  path: include_blocks/gpio_bank_common.yaml
programs:
- id: pwm_vecpack
  type: vecpack
  config:
    inputs:
    - *pwm_ch0
    - *pwm_ch1
    - *pwm_ch2
    - *pwm_ch3
    output: *pwm0
protocols:
- id: nimble1
  type: nimble
  config:
    gap_name: dawn-aios
    services:
      dis:
        enabled: true
      aios:
        groups:
        - digital_inputs:
          - "@gpio.gpi1"
          - "@gpio.gpi2"
          - "@gpio.gpi3"
          - "@gpio.gpi4"
          digital_outputs:
          - "@gpio.gpo1"
          - "@gpio.gpo2"
          - "@gpio.gpo3"
          - "@gpio.gpo4"
        - analog_inputs:
          - *analog_input_io
          analog_outputs:
          - data: *pwm_ch0
            metadata:
              user_description: "PWM ch0"
          - data: *pwm_ch1
            metadata:
              user_description: "PWM ch1"
          - data: *pwm_ch2
            metadata:
              user_description: "PWM ch2"
          - data: *pwm_ch3
            metadata:
              user_description: "PWM ch3"
          - data: *pwm_freq
            metadata:
              user_description: "PWM freq"
