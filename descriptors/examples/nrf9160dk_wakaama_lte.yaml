metadata:
  title: nrf9160-dk Wakaama LwM2M over LTE
  version: '1.0'
  description: >
    nrf9160-dk hardware demo: bring up LTE, then register with the public
    Eclipse Leshan sandbox over Wakaama LwM2M.
  os_required:
  - udp
  - /tmp
system:
- id: lte_main
  type: lte
  config:
    # Empty APN: rely on network/SIM auto-attach. Set apn (and optionally
    # username/password/auth_type/ip_type) to override the Kconfig defaults.
    apn: ''
    ip_type: 0

includes:
- id: wk
  path: include_blocks/wakaama_objects_common.yaml

protocols:
- id: wakaama_main
  type: wakaama
  config:
    endpoint: dawn-wakaama-leshan
    server_host: 23.97.187.154
    local_port: 56830
    servers:
      - host: 23.97.187.154
        port: 5683
        lifetime: 300
        short_server_id: 123
    device:
      manufacturer: Dawn
      serial_number: dawn-wakaama-leshan
      firmware_version: '0.1'
    objects:
      - object: digital_input
        instance: 0
        resources:
        - resource: digital_input_state
          io: "@wk.wakaama_digital_input"
          access: read
      - object: digital_output
        instance: 0
        resources:
        - resource: digital_output_state
          io: "@wk.wakaama_digital_output"
          access: rw
      - object: analog_input
        instance: 0
        resources:
        - resource: analog_input_current_value
          io: "@wk.wakaama_analog_input"
          access: read
      - object: analog_output
        instance: 0
        resources:
        - resource: analog_output_current_value
          io: "@wk.wakaama_analog_output"
          access: rw
      - object: generic_sensor
        instance: 0
        resources:
        - resource: sensor_value
          io: "@wk.wakaama_generic_sensor"
          access: read
      - object: temperature
        instance: 0
        resources:
        - resource: sensor_value
          io: "@wk.wakaama_temperature"
          access: read
      - object: humidity
        instance: 0
        resources:
        - resource: sensor_value
          io: "@wk.wakaama_humidity"
          access: read
      - object: actuation
        instance: 0
        resources:
        - resource: on_off
          io: "@wk.wakaama_switch"
          access: rw
      - object: light_control
        instance: 0
        resources:
        - resource: on_off
          io: "@wk.wakaama_switch"
          access: rw
        - resource: dimmer
          io: "@wk.wakaama_dimmer"
          access: rw
      - object: binary_app_data_container
        instance: 0
        resources:
        - resource: binary_app_data
          io: "@wk.wakaama_blob"
          access: rw
      - object: firmware_update
        instance: 0
        resources:
        - resource: firmware_package
          io: "@wk.wakaama_firmware_package"
          access: rw
        - resource: firmware_update
          io: "@wk.wakaama_firmware_update_trigger"
          access: execute
        - resource: firmware_state
          io: "@wk.wakaama_firmware_state"
          access: read
        - resource: firmware_update_result
          io: "@wk.wakaama_firmware_result"
          access: read
      - object_id: 33000
        instance: 0
        resources:
        - resource_id: 1
          io: "@wk.wakaama_counter"
          access: rw
